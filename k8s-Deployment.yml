---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: javaweb-deploy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: javawebapp
  template:
    metadata:
      labels:
        app: javawebapp
    spec:
      containers:
        - name: javawebapp-container
          image: thufel18/java-web-app
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: javawebapp-svc
spec:
  type: LoadBalancer
  selector:
    app: javawebapp
  ports:
    - port: 80
      targetPort: 8080
#User -> LoadBalancer (port 80) -> Service -> Deployment Pods (port 8080) -> Java Web Application
