---
apiVersion: v1
kind: Pod
metadata:
  name: javawebapp-pod
  labels:
    app: javawebapp
spec:
  containers:
    - name: javawebapp-container
      image: thufel18/java-web-app
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: javawebapp-svc
spec:
  type: NodePort
  selector:
    app: javawebapp
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30070
# traffic flow
#Browser -> NodeIP:30070 -> Service (port 80) -> Pod -> Container:8080
